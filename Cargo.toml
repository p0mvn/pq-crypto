[package]
name = "pq-crypto"
version = "0.1.0-rc2"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/p0mvn/pq-crypto"
description = "Post-quantum hash-based signatures: standalone fixed-profile RFC 8391 WOTS+ and FIPS 205 FORS"
exclude = [".cursor/", "docs/notes.md"]

[dependencies]
rand_core = "0.10.1"
sha2 = { version = "0.11.1", features = ["zeroize"] }
zeroize = "1.8"

[dev-dependencies]
getrandom = { version = "0.4", features = ["sys_rng"] }

# Debug-build tests hash millions of times for the larger FORS shapes, so build the
# dependencies, SHA-2 among them, with optimizations.
[profile.dev.package."*"]
opt-level = 3
