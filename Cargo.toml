[package]
name = "wots-plus"
version = "0.1.0-rc0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/p0mvn/wots-plus"
description = "Standalone fixed-profile RFC 8391 WOTS+ signatures"
exclude = [".cursor/", "docs/notes.md"]

[dependencies]
rand_core = "0.10.1"
sha2 = { version = "0.11.1", features = ["zeroize"] }
zeroize = "1.8"

[dev-dependencies]
getrandom = { version = "0.4", features = ["sys_rng"] }
